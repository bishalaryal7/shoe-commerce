name: shoe-commerce

services:
  mysql:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
      MARIADB_DATABASE: shoe_commerce
      MARIADB_USER: ${DB_USERNAME:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-3309}:3306'
    volumes:
      - shoe_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - '127.0.0.1:8100:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  shoe_mysql_data:
