name: shoe-commerce-tests
services:
  mysql:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
      MARIADB_DATABASE: shoe_commerce_test
      MARIADB_USER: laravel
      MARIADB_PASSWORD: ci-test-password
    ports:
      - '127.0.0.1:3310:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
